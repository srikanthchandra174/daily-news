name: Fetch news

on:
  schedule:
    # Every 6 hours. Cron is UTC; these land at 07:00, 13:00, 19:00 and 01:00 IST
    # so the first run of the day is ready before the morning read.
    - cron: '30 1,7,13,19 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch feeds
        run: node scripts/fetch-news.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --quiet --cached; then
            echo "No changes."
          else
            git commit -m "Update news.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --autostash origin main
            git push
          fi
